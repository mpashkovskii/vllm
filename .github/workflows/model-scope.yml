name: Model scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Record CI approval]
    types: [completed]

concurrency:
  group: >-
    model-scope-${{
      github.event.pull_request.number ||
      github.event.workflow_run.pull_requests[0].number ||
      github.event.workflow_run.id
    }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    if: >-
      github.repository_owner == 'vllm-project' &&
      (github.event_name == 'pull_request_target' ||
      (github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: [self-hosted, linux, x64, vllm-runners]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Label model-scoped PRs
        run: >-
          uv run --no-project --python 3.12 --with regex
          .github/workflows/scripts/model_scope.py
        env:
          GH_TOKEN: ${{ github.token }}
